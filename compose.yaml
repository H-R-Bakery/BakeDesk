services:
  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      #      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      - $PWD/docker/db/data:/var/lib/postgresql:rw
    ports:
      - "5432:5432"
  ###< doctrine/doctrine-bundle ###
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      # Uncomment the following line to disable HTTPS,
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET}"
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000
    # Comment the following line to disable the development mode
    #    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:2019/mercure/health/ready"
        ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - $PWD/docker/mercure/data:/data
      - $PWD/docker/mercure/config:/config
    ports:
      - "3000:80"

  gotenberg:
    image: gotenberg/gotenberg:8-chromium
    restart: unless-stopped
    command:
      - "gotenberg"
      #            - "--log-level=debug"
      - "--api-port=8833"
    expose:
      - "8833"
    # Host access is bound to loopback for local preview only. Containerized
    # applications should use http://gotenberg:8833 over the Compose network.
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-18833}:8833"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8833/health" ]
      timeout: 5s
      retries: 5
      start_period: 30s

  ###< symfony/mercure-bundle ###
  #volumes:
  ###> doctrine/doctrine-bundle ###
#  database_data:
###< doctrine/doctrine-bundle ###

